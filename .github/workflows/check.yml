name: VPN Gate Node Check

# 模板仓库默认不配置定时任务：需要自动更新时，把下面的注释替换成你自己的 cron。
# 注意：GitHub 调度最小间隔约 5 分钟，但通常会延迟几分钟；仓库连续 60 天无提交会让定时任务自动停用。
#
# on:
#   schedule:
#     - cron: '*/30 * * * *'

on:
  push:
    paths:
      - '.github/workflows/check.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '16'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-residential-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 abc.workers.dev）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '16' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0.05'
          HOSTS_ENTRY: '104.19.2.253:2096'
          OPTIMAL_API: ''
          MAX_RESIDENTIAL_PER_COUNTRY: '3'
          MAX_DATACENTER_PER_COUNTRY: '0'
        run: python vpngate.py

      - name: Select repeat-checked US and Asian residential backups
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          from pathlib import Path
          import statistics
          from urllib.parse import quote
          import requests
          
          root = Path('public')
          data = json.loads((root / 'data.json').read_text())
          worker = os.environ['CHECK_WORKER']
          entry = '104.19.2.253:2096'
          preferred_japan = 'vpn864205373.opengw.net'
          
          def verify(node):
              session = requests.Session()
              values = [node['latency_ms']]
              try:
                  for _ in range(2):
                      response = session.get(worker + quote(f"{node['host']}:{node['port']}", safe=''), timeout=15)
                      response.raise_for_status()
                      result = response.json()
                      delay = result.get('responseTime')
                      exit_info = result.get('exit') or {}
                      if not result.get('success') or not isinstance(delay, (int, float)) or not 0 < delay <= 5000:
                          return None
                      if str(exit_info.get('country_code', '')).upper() != node['country_code']:
                          return None
                      values.append(delay)
                  if max(values) - min(values) > 1500:
                      return None
              except (requests.RequestException, ValueError, TypeError):
                  return None
              return {**node, 'repeat_checker_ms': values, 'repeat_median_ms': statistics.median(values)}
          
          selected = []
          counts = {}
          for code, limit in [('US', 3), ('JP', 3), ('SG', 3)]:
              if code == 'SG' and counts.get('JP'):
                  continue
              candidates = [n for n in data['countries'].get(code, {}).get('nodes', [])
                            if n.get('residential') == 'residential' and isinstance(n.get('latency_ms'), (int, float))
                            and 0 < n['latency_ms'] <= 5000
                            and str((n.get('exit') or {}).get('country_code', '')).upper() == code]
              candidates.sort(key=lambda n: (n['host'] != preferred_japan if code == 'JP' else False, n['latency_ms']))
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  stable = [n for n in pool.map(verify, candidates[:6]) if n]
              stable.sort(key=lambda n: (n['host'] != preferred_japan if code == 'JP' else False, n['repeat_median_ms']))
              chosen = stable[:limit]
              counts[code] = len(chosen)
              selected.extend(chosen)
          
          if not selected:
              raise SystemExit('No requested-country residential backups passed repeat checks; retain previous deployment')
          names = {'US': '美国', 'JP': '日本', 'SG': '新加坡'}
          numbered = {}
          lines = []
          for node in selected:
              code = node['country_code']
              numbered[code] = numbered.get(code, 0) + 1
              lines.append(f"{entry}#{names[code]}-住宅备用-{numbered[code]:02d}$sstp://vpn:vpn@{node['host']}:{node['port']}")
          (root / 'nodes.txt').write_text('\n'.join(lines) + '\n')
          policy = {'countries':counts, 'nodes':len(lines), 'checker_repeats':3,
                    'note':'Free shared backups. Checker duration is not client RTT; stable sub-400ms is not guaranteed.'}
          data['subscription_policy'] = policy
          (root / 'data.json').write_text(json.dumps(data, ensure_ascii=False))
          summary = f"\n### Residential backup policy\n\nUS first (max 3), JP or SG (max 3); distinct exit servers, other countries excluded.\n\nPublished: {counts}. Three successful checker samples per node. These checks do not guarantee client RTT below 400 ms.\n"
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          PY

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET ${api} -> ${status}"

          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi

          if [ "${status}" = "404" ]; then
            # 创建站点必须用 POST，且 workflow 构建类型不接受 source 字段
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST ${api} -> ${create}"
            case "${create}" in
              201|204|409)
                echo "GitHub Pages 已启用（或已存在），等待生效"
                sleep 10
                exit 0
                ;;
              *)
                echo "::error::自动启用 Pages 失败（HTTP ${create}）。请打开仓库 Settings → Pages，把 Source 选为 GitHub Actions，然后重新运行本工作流。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi

          echo "::error::查询 Pages 状态失败（HTTP ${status}），请检查仓库 Pages 设置或工作流权限。"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

